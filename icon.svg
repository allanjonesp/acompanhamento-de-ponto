<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <!-- Fundo com cantos arredondados (squircle app icon) -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />
  <!-- Mostrador do Relógio de Ponto -->
  <circle cx="256" cy="256" r="170" fill="#ffffff" />
  <circle cx="256" cy="256" r="148" fill="#f8fafc" stroke="#e2e8f0" stroke-width="8" />
  
  <!-- Marcadores de horas -->
  <circle cx="256" cy="140" r="10" fill="#2563eb" />
  <circle cx="372" cy="256" r="10" fill="#2563eb" />
  <circle cx="256" cy="372" r="10" fill="#2563eb" />
  <circle cx="140" cy="256" r="10" fill="#2563eb" />
  
  <!-- Ponteiros do Relógio -->
  <!-- Ponteiro das horas (aponta para as 9h) -->
  <line x1="256" y1="256" x2="180" y2="256" stroke="#0f172a" stroke-width="16" stroke-linecap="round" />
  <!-- Ponteiro dos minutos (aponta para as 12h) -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#2563eb" stroke-width="12" stroke-linecap="round" />
  <!-- Eixo central -->
  <circle cx="256" cy="256" r="18" fill="#0f172a" />
  <circle cx="256" cy="256" r="8" fill="#60a5fa" />
  
  <!-- Emblema de verificado / confirmação no canto -->
  <circle cx="380" cy="380" r="64" fill="#10b981" stroke="#ffffff" stroke-width="12" />
  <path d="M352 380 L372 400 L412 360" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
